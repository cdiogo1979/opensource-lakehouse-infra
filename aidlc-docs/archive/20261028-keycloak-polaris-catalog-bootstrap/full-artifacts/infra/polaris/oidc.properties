# Apache Polaris 1.8.0 Keycloak external identity settings.
# Polaris obtains signing keys through Docker service DNS. The canonical token
# issuer remains keycloak.localhost and is checked exactly below.
polaris.authentication.type=internal
polaris.authentication."lakehouse".type=mixed
polaris.authentication.authenticator.type=default
polaris.authentication.token-service.type=default
polaris.realm-context.realms=lakehouse
polaris.realm-context.header-name=Polaris-Realm
# This stack currently configures one realm. Iceberg 1.8.1's S3 credential
# refresh path omits custom realm headers, so route headerless refreshes to the
# sole configured default realm. Set this back to true before adding another realm.
polaris.realm-context.require-header=false

quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/lakehouse
quarkus.oidc.discovery-enabled=false
quarkus.oidc.token.issuer=http://keycloak.localhost:8080/realms/lakehouse
quarkus.oidc.jwks-path=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/certs
quarkus.oidc.client-id=polaris
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=resource_access/polaris/roles

# Keycloak sub is retained for identity correlation; principal_name resolves
# the pre-provisioned Polaris principal by its stable username.
polaris.oidc.principal-mapper.type=default
polaris.oidc.principal-mapper.name-claim-path=preferred_username

# Only the four explicitly provisioned product roles can enter Polaris RBAC.
polaris.oidc.principal-roles-mapper.type=default
polaris.oidc.principal-roles-mapper.filter=^role-default-(developer|analyst|owner|writer)$
polaris.oidc.principal-roles-mapper.mappings[0].regex=^(role-default-(?:developer|analyst|owner|writer))$
polaris.oidc.principal-roles-mapper.mappings[0].replacement=PRINCIPAL_ROLE:$1
