# StarRocks 4.1.7 FE configuration for the local lakehouse (mounted read-only).
# Upstream defaults with a smaller heap for laptops; keep -Xmx below
# STARROCKS_FE_MEMORY_LIMIT. Contains no secrets.
LOG_DIR = ${STARROCKS_HOME}/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx1280m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log -Djava.security.policy=${STARROCKS_HOME}/conf/udf_security.policy"
sys_log_level = INFO
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
meta_dir = ${STARROCKS_HOME}/meta
# Single-BE cluster: Iceberg writes and internal tables use one replica.
default_replication_num = 1

# Every MySQL-protocol connection must use TLS: password logins send the password
# to the FE in clear text inside the TLS session (mysql_clear_password).
ssl_force_secure_transport = true

# Password logins are checked against the LDAP directory by binding as the user
# (no LDAP credential is held by StarRocks), over LDAPS verified with the local CA.
# The bind DN pattern (uid=${USER},...) is set at every start by
# bootstrap-starrocks.py --runtime-only, because fe.conf expands ${...} as
# environment variables and the FE would refuse to start.
authentication_ldap_simple_server_host = ldap
authentication_ldap_simple_server_port = 636
authentication_ldap_simple_ssl_conn_allow_insecure = false
authentication_ldap_simple_ssl_conn_trust_store_path = /run/certs/ldap-ca.crt
