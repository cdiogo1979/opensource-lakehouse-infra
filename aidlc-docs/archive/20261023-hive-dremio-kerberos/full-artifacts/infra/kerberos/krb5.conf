[libdefaults]
  default_realm = LAKEHOUSE.LOCAL
  dns_lookup_realm = false
  dns_lookup_kdc = false
  rdns = false
  forwardable = true
  ticket_lifetime = 10h
  renew_lifetime = 7d

[realms]
  LAKEHOUSE.LOCAL = {
    kdc = kdc:88
    admin_server = kdc:749
  }

[domain_realm]
  .lakehouse.local = LAKEHOUSE.LOCAL
  lakehouse.local = LAKEHOUSE.LOCAL
