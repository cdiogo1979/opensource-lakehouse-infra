# Keep the pinned image's standalone paths and coordinator/executor roles.
paths: {
  local: ${DREMIO_HOME}"/data"
  dist: "file:///opt/dremio/data/dist"
}

services: {
  coordinator.enabled: true,
  coordinator.master.enabled: true,
  executor.enabled: true,
  flight.use_session_service: true
}

services.kerberos: {
  principal: "dremio@LAKEHOUSE.LOCAL"
  keytab.file.path: "/run/credentials/dremio.keytab"
}
