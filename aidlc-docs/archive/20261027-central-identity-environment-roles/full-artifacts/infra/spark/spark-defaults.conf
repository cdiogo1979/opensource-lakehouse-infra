spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.defaultCatalog=iceberg
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.hive.HiveCatalog
spark.sql.catalog.iceberg.uri=thrift://hive-metastore:9083
spark.sql.catalog.iceberg.warehouse=s3a://lake/warehouse/
spark.sql.catalog.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint=http://object-store:9000
spark.sql.catalog.iceberg.s3.path-style-access=true
spark.sql.catalog.iceberg.s3.region=us-east-1

# Mask credential-bearing configuration names and credential-like values in
# Spark diagnostics and UI surfaces. Actual credentials stay in the private
# AWS shared-credentials file under the service tmpfs.
spark.redaction.regex=(?i)secret|password|access[._-]?key|token|credential
spark.redaction.string.regex=(?i)aws_access_key_id|aws_secret_access_key|secret|password|token|access[._-]?key

# The client process must obtain a TGT as its effective caller before catalog
# operations. Unit 2/3 provisions that caller; the service endpoint uses SASL.
spark.hadoop.hadoop.security.authentication=kerberos
spark.kerberos.renewal.credentials=ccache
spark.hadoop.hive.metastore.sasl.enabled=true
spark.hadoop.hive.metastore.kerberos.principal=hive/hive-metastore@LAKEHOUSE.LOCAL
