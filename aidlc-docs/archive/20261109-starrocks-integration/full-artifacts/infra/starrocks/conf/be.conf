# StarRocks 4.1.7 BE configuration for the local lakehouse (mounted read-only).
# Upstream defaults; BE memory follows the container limit
# (STARROCKS_BE_MEMORY_LIMIT). Contains no secrets.
sys_log_level = INFO
be_port = 9060
be_http_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060
starlet_port = 9070
storage_root_path = ${STARROCKS_HOME}/storage
JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
