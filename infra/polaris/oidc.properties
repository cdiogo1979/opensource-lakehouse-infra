# Apache Polaris 1.8.0 Keycloak external identity settings.
# Polaris obtains signing keys through Docker service DNS. The canonical token
# issuer remains keycloak.localhost and is checked exactly below.
polaris.authentication.type=internal
polaris.authentication."lakehouse".type=mixed
polaris.authentication.authenticator.type=default
polaris.authentication.token-service.type=default
polaris.realm-context.realms=lakehouse
polaris.realm-context.header-name=Polaris-Realm
# This stack currently configures one realm. Keep the configured lakehouse
# realm as the default until realm-aware vended-credential refresh is verified.
polaris.realm-context.require-header=false

quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/lakehouse
quarkus.oidc.discovery-enabled=false
quarkus.oidc.token.issuer=http://keycloak.localhost:8080/realms/lakehouse
quarkus.oidc.jwks-path=http://keycloak:8080/realms/lakehouse/protocol/openid-connect/certs
quarkus.oidc.client-id=polaris
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=resource_access/polaris/roles

# Keycloak sub is retained for identity correlation; principal_name resolves
# the pre-provisioned Polaris principal by its stable username.
polaris.oidc.principal-mapper.type=default
polaris.oidc.principal-mapper.name-claim-path=preferred_username

# Only data product roles can enter Polaris RBAC: role-<token>-<role> for any
# product (the data_products.GROUP_PATTERN). A role only grants access through
# the principal role the product bootstrap creates, so new products need no
# Polaris restart.
polaris.oidc.principal-roles-mapper.type=default
polaris.oidc.principal-roles-mapper.filter=^role-[a-z][a-z0-9]{1,19}-(developer|analyst|owner|writer)$
polaris.oidc.principal-roles-mapper.mappings[0].regex=^(role-[a-z][a-z0-9]{1,19}-(?:developer|analyst|owner|writer))$
polaris.oidc.principal-roles-mapper.mappings[0].replacement=PRINCIPAL_ROLE:$1

# Keep Polaris management and health endpoints inside the container network
# namespace. Compose does not publish port 8182.
quarkus.management.host=127.0.0.1

# Short-lived STS credentials and bounded per-stage connection waits. These
# controls do not provide a strict end-to-end five-second request deadline.
polaris.features."STORAGE_CREDENTIAL_DURATION_SECONDS"=3600
polaris.features."STORAGE_CREDENTIAL_CACHE_DURATION_SECONDS"=600
# Data products share the environment catalogs, each namespace in its product's
# bucket. Polaris 1.8 accepts a namespace location only with this server-wide
# flag (the per-catalog property is ignored); tables stay confined to each
# catalog's allowed locations.
polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
polaris.storage.max-http-connections=8
polaris.storage.connection-acquisition-timeout=PT1S
polaris.storage.connect-timeout=PT1S
polaris.storage.read-timeout=PT2S
